version: '3.8'

services:
  # 🗄️ BASE DE DATOS POSTGRESQL
  postgres:
    image: postgres:15-alpine
    container_name: financial-postgres
    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: perupcs123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/01-init-database.sql
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 👥 CUSTOMER SERVICE
  customer-service:
    build: ./customer-service
    container_name: financial-customer-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 🔥 URLs corregidas para usar el contenedor postgres
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/financial_db
      SPRING_R2DBC_USERNAME: admin
      SPRING_R2DBC_PASSWORD: perupcs123
      ENCRYPTION_SECRET_KEY: MySecretKey12345
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financial-network

  # 💳 FINANCIAL PRODUCTS SERVICE
  financial-products-service:
    build: ./financial-products-service
    container_name: financial-products-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 🔥 URLs corregidas para usar el contenedor postgres
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/financial_db
      SPRING_R2DBC_USERNAME: admin
      SPRING_R2DBC_PASSWORD: perupcs123
      ENCRYPTION_SECRET_KEY: MySecretKey12345
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financial-network

  # 🌐 BFF SERVICE
  bff-service:
    build: ./bff-service
    container_name: financial-bff-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 🔥 URLs corregidas para usar los nombres de contenedores
      SERVICES_CUSTOMER_BASE_URL: http://customer-service:8081
      SERVICES_FINANCIAL_PRODUCTS_BASE_URL: http://financial-products-service:8082
      ENCRYPTION_SECRET_KEY: MySecretKey12345
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      - customer-service
      - financial-products-service
    networks:
      - financial-network

volumes:
  postgres_data:

networks:
  financial-network:
    driver: bridge