# Entorno local. Los tres servicios salen de la MISMA imagen (Dockerfile de la raiz),
# seleccionando el modulo con APP_MODULE. Antes cada modulo tenia su Dockerfile y todos
# copiaban target/*.jar, asi que "docker compose up --build" fallaba si no se habia ejecutado
# "mvn package" a mano.

services:
  postgres:
    image: postgres:17-alpine
    container_name: financial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Demo1234!
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/01-init-database.sql:ro
      - ./init-db/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-api-microservices:local
    container_name: financial-customer-service
    restart: unless-stopped
    environment:
      APP_MODULE: customer
      PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/financial_db
      SPRING_R2DBC_USERNAME: admin
      SPRING_R2DBC_PASSWORD: Demo1234!
      R2DBC_POOL_INITIAL_SIZE: 1
      R2DBC_POOL_MAX_SIZE: 5
      ENCRYPTION_SECRET_KEY: MySecretKey12345
      JAVA_OPTS: "-Xms64m -Xmx320m -XX:+UseSerialGC"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  financial-products-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-api-microservices:local
    container_name: financial-products-service
    restart: unless-stopped
    environment:
      APP_MODULE: products
      PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/financial_db
      SPRING_R2DBC_USERNAME: admin
      SPRING_R2DBC_PASSWORD: Demo1234!
      R2DBC_POOL_INITIAL_SIZE: 1
      R2DBC_POOL_MAX_SIZE: 5
      ENCRYPTION_SECRET_KEY: MySecretKey12345
      JAVA_OPTS: "-Xms64m -Xmx320m -XX:+UseSerialGC"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  bff-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-api-microservices:local
    container_name: financial-bff-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_MODULE: bff
      PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SERVICES_CUSTOMER_BASE_URL: http://customer-service:8081
      SERVICES_FINANCIAL_PRODUCTS_BASE_URL: http://financial-products-service:8082
      ENCRYPTION_SECRET_KEY: MySecretKey12345
      DEMO_ENABLED: "true"
      JAVA_OPTS: "-Xms64m -Xmx320m -XX:+UseSerialGC"
    depends_on:
      customer-service:
        condition: service_healthy
      financial-products-service:
        condition: service_healthy
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
    driver: local
    name: financial_postgres_data

networks:
  financial-network:
    driver: bridge
    name: financial-network
