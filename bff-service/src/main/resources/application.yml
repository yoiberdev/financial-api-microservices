# Cloud Run inyecta PORT; en local se usa 8080.
server:
  port: ${PORT:8080}

spring:
  application:
    name: bff-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  webflux:
    multipart:
      max-in-memory-size: ${WEBFLUX_MAX_IN_MEMORY_SIZE:10MB}

# OJO: spring.security.oauth2.resourceserver.jwt.issuer-uri NO se declara aqui.
# Si esa propiedad existe, Spring Boot crea el ReactiveJwtDecoder al arrancar y descarga la
# metadata del emisor; con el valor por defecto (Keycloak en localhost:9000) el contexto no
# levantaba si no habia Keycloak. Vive solo en application-prod.yml.

# Configuración de cifrado
encryption:
  aes:
    secret-key: ${ENCRYPTION_SECRET_KEY:MySecretKey12345}
    algorithm: ${ENCRYPTION_ALGORITHM:AES/ECB/PKCS5Padding}
    charset: ${ENCRYPTION_CHARSET:UTF-8}
    # enhanced (por defecto) | basic
    implementation: ${ENCRYPTION_IMPLEMENTATION:enhanced}

# URLs de microservicios
services:
  customer:
    base-url: ${SERVICES_CUSTOMER_BASE_URL:http://localhost:8081}
  financial-products:
    base-url: ${SERVICES_FINANCIAL_PRODUCTS_BASE_URL:http://localhost:8082}

# Endpoints de apoyo de la demo publica (se activan en el perfil demo)
demo:
  enabled: ${DEMO_ENABLED:false}

# Configuración de logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.financial.bff: ${LOGGING_LEVEL_COM_FINANCIAL:DEBUG}
    org.springframework.web.reactive.function.client: ${LOGGING_LEVEL_WEBCLIENT:DEBUG}

# Configuración de Actuator
management:
  endpoints:
    enabled-by-default: ${MANAGEMENT_ENDPOINTS_ENABLED:true}
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
