server:
  port: 8080

spring:
  application:
    name: bff-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000/realms/financial}
  webflux:
    multipart:
      max-in-memory-size: ${WEBFLUX_MAX_IN_MEMORY_SIZE:10MB}

# Configuración de cifrado
encryption:
  aes:
    secret-key: ${ENCRYPTION_SECRET_KEY:MySecretKey12345}
    algorithm: ${ENCRYPTION_ALGORITHM:AES/ECB/PKCS5Padding}
    charset: ${ENCRYPTION_CHARSET:UTF-8}

# URLs de microservicios
services:
  customer:
    base-url: ${SERVICES_CUSTOMER_BASE_URL:http://customer-service:8081}
  financial-products:
    base-url: ${SERVICES_FINANCIAL_PRODUCTS_BASE_URL:http://financial-products-service:8082}

# Configuración de logging
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.financial.bff: ${LOGGING_LEVEL_COM_FINANCIAL:DEBUG}
    org.springframework.web.reactive.function.client: DEBUG

# Configuración de Actuator
management:
  endpoints:
    enabled-by-default: ${MANAGEMENT_ENDPOINTS_ENABLED:true}
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html